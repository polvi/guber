SPECIFICATION
  AuthSpec

CONSTANTS
  PasskeyCRD = PasskeyCRD
  OtherCRD = OtherCRD
  r1 = r1
  r2 = r2
  u1 = u1
  u2 = u2
  schema1 = schema1
  pubkey1 = pubkey1
  pubkey2 = pubkey2
  ch1 = ch1
  ch2 = ch2
  
  (* Signatures are modeled as records to allow verification logic *)
  sig1 = [key |-> pubkey1, challenge |-> ch1]
  sig2 = [key |-> pubkey1, challenge |-> ch2]
  sig3 = [key |-> pubkey2, challenge |-> ch1]
  sig4 = [key |-> pubkey2, challenge |-> ch2]

  CRDNames        = {PasskeyCRD, OtherCRD}
  ResourceNames   = {r1, r2}
  Users           = {u1, u2}
  Schemas         = {schema1}
  Specs           = {pubkey1, pubkey2}
  Challenges      = {ch1, ch2}
  Signatures      = {sig1, sig2, sig3, sig4}
  MaxVersion      = 2
  SymmetrySet     = {r1, r2}

INVARIANT
  ValidResourceCRD
  SchemaCorrectness
  VersionWellFormed
  NoOrphanAuth
  NoChallengeReplay

PROPERTY
  EventuallyConsistent
