SPECIFICATION
  AuthSpec

CONSTANTS
  crd1 = PasskeyCRD
  crd2 = OtherCRD
  r1 = r1
  r2 = r2
  schema1 = schema1
  spec1 = pubkey1
  ch1 = ch1
  sig1 = sig1
  CRDNames        = {PasskeyCRD, OtherCRD}
  ResourceNames   = {r1, r2}
  Schemas         = {schema1}
  Specs           = {pubkey1}
  Challenges      = {ch1}
  Signatures      = {sig1}
  MaxVersion      = 2
  SymmetrySet     = {r1, r2}

INVARIANT
  ValidResourceCRD
  SchemaCorrectness
  VersionWellFormed
  NoOrphanAuth

PROPERTY
  EventuallyConsistent
