SPECIFICATION
  AuthSpec

CONSTANTS
  PasskeyCRD = PasskeyCRD
  OtherCRD = OtherCRD
  r1 = r1
  r2 = r2
  u1 = u1
  u2 = u2
  schema1 = schema1
  pubkey1 = pubkey1
  pubkey2 = pubkey2
  ch1 = ch1
  ch2 = ch2

  CRDNames        = {PasskeyCRD, OtherCRD}
  ResourceNames   = {r1, r2}
  Users           = {u1, u2}
  Schemas         = {schema1}
  Specs           = {pubkey1, pubkey2}
  Challenges      = {ch1, ch2}
  MaxVersion      = 2
  SymmetrySet     = {r1, r2}

INVARIANT
  ValidResourceCRD
  SchemaCorrectness
  VersionWellFormed
  NoOrphanAuth
  NoChallengeReplay

PROPERTY
  EventuallyConsistent
