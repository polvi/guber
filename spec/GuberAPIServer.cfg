SPECIFICATION
  Spec

CONSTANTS
  crd1 = crd1
  crd2 = crd2
  r1 = r1
  r2 = r2
  ns1 = ns1
  ns2 = ns2
  schema1 = schema1
  spec1 = spec1
  CRDNames        = {crd1, crd2}
  ResourceNames   = {r1, r2}
  Namespaces      = {ns1, ns2}
  Schemas         = {schema1}
  Specs           = {spec1}
  MaxVersion      = 3
  MaxNamespaces   = 2

INVARIANT
  ValidResourceCRD
  SchemaCorrectness
  VersionWellFormed
  NamespaceCorrectness

PROPERTY
  EventuallyConsistent
  EventuallyDeleted
